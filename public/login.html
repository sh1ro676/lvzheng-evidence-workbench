<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>律途 · 访问验证</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #f4f1ec; color: #1f2833;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 380px; background: #fff; border-radius: 18px;
    padding: 30px 26px 26px; box-shadow: 0 18px 50px rgba(31, 40, 51, .12);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .mark {
    width: 38px; height: 38px; border-radius: 10px; background: #14342b; color: #fff;
    display: grid; place-items: center; font-size: 19px; font-weight: 700;
  }
  .brand strong { font-size: 18px; letter-spacing: .04em; }
  .brand span { display: block; font-size: 11px; color: #7b8794; letter-spacing: .18em; text-transform: uppercase; }
  h1 { margin: 0 0 8px; font-size: 20px; }
  p.lead { margin: 0 0 20px; color: #5b6670; font-size: 13px; line-height: 1.7; }
  label { display: block; font-size: 12px; color: #5b6670; margin-bottom: 7px; }
  input {
    width: 100%; padding: 13px 14px; font-size: 16px; border: 1px solid #d5dce4;
    border-radius: 10px; outline: none; transition: border-color .15s ease, box-shadow .15s ease;
  }
  input:focus { border-color: #0b5cab; box-shadow: 0 0 0 3px rgba(11, 92, 171, .12); }
  button {
    width: 100%; margin-top: 16px; padding: 14px; border: 0; border-radius: 10px;
    background: #14342b; color: #fff; font-size: 15px; font-weight: 650; cursor: pointer;
  }
  button:disabled { opacity: .6; }
  .error { min-height: 18px; margin-top: 12px; color: #b42318; font-size: 12.5px; }
  .foot { margin-top: 18px; color: #98a2ad; font-size: 11px; line-height: 1.6; }
</style>
</head>
<body>
  <form class="card" id="form" autocomplete="on">
    <div class="brand">
      <div class="mark">§</div>
      <div><strong>律途</strong><span>Legal AI Assistant</span></div>
    </div>
    <h1>输入访问密码</h1>
    <p class="lead">这是一套内部研究工具，请输入管理员提供的访问密码。验证一次后，这台设备 30 天内免登录。</p>
    <label for="password">访问密码</label>
    <input id="password" name="password" type="password" inputmode="text" autocomplete="current-password" required autofocus>
    <button type="submit" id="submit">进入工作台</button>
    <div class="error" id="error"></div>
    <p class="foot">仅用于法律文献检索与研究辅助，正式使用前请由律师复核。</p>
  </form>
<script>
  const form = document.getElementById('form')
  const input = document.getElementById('password')
  const button = document.getElementById('submit')
  const error = document.getElementById('error')

  form.addEventListener('submit', async (event) => {
    event.preventDefault()
    error.textContent = ''
    button.disabled = true
    button.textContent = '验证中…'
    try {
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: input.value }),
      })
      if (response.ok) {
        const next = new URLSearchParams(location.search).get('next')
        location.replace(next && next.startsWith('/') && !next.startsWith('//') ? next : '/')
        return
      }
      const data = await response.json().catch(() => ({}))
      error.textContent = data.error || '密码不正确，请重试'
      input.select()
    } catch (failure) {
      error.textContent = '网络异常，请检查连接后重试'
    } finally {
      button.disabled = false
      button.textContent = '进入工作台'
    }
  })
</script>
</body>
</html>
